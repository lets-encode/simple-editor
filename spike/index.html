<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1c2230" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Gesture spike</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="main">
        <!-- The score and the entry pane share one gesture recogniser, so two fingers may span both. -->
        <div id="work">
          <main id="stage">
            <div id="score" aria-label="Score"></div>
            <div id="box" hidden></div>
            <div id="caret" hidden></div>
            <div id="slots"></div>
            <!-- The selection continues on an earlier or later page. -->
            <div id="edge-prev" class="edge" hidden></div>
            <div id="edge-next" class="edge" hidden></div>
            <div id="hud">
              <span id="hud-gesture"></span>
              <span id="hud-selection"></span>
            </div>
            <div id="loading">Loading Verovio…</div>
          </main>
          <!-- The entry pane beside the score, below the sheet; see src/pane.js. -->
          <div id="pane" aria-label="Note entry" hidden></div>
          <div id="pane-label" hidden></div>
        </div>
        <!-- The facsimile sheet slides over the score from the top; see src/facsimile.js. -->
        <section id="sheet" aria-label="Source facsimile" hidden>
          <div id="fac-view">
            <div id="fac-content">
              <img id="fac-img" alt="" draggable="false" />
              <div id="fac-zones"></div>
            </div>
            <button type="button" id="fac-sync" hidden>Sync</button>
          </div>
          <div id="fac-handle"><span class="grip"></span><span class="label">Source</span></div>
        </section>
      </div>
      <nav id="bar" aria-label="Controls"></nav>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <a id="about" href="./about.html" target="_blank" rel="noopener">About this prototype</a>
        <small id="build"></small>
        <h2>Gesture settings</h2>
        <label>
          Score
          <select name="fixture"></select>
        </label>
        <label>
          Flick window (lift sooner for one step) <output></output> ms
          <input type="range" name="swipeWindowMs" min="100" max="500" step="10" />
        </label>
        <label>
          Hold still this long to arm a drag box <output></output> ms
          <input type="range" name="holdMs" min="150" max="800" step="25" />
        </label>
        <label>
          Scrub direction (horizontal or vertical) judged over the first <output></output> px
          <input type="range" name="axisPx" min="8" max="60" step="2" />
        </label>
        <label>
          Scrub step <output></output> px of travel
          <input type="range" name="scrubStepPx" min="8" max="80" step="2" />
        </label>
        <label>
          Scrub steps back only <output></output> px past a step (hysteresis)
          <input type="range" name="scrubBackPx" min="0" max="20" step="1" />
        </label>
        <label>
          Scrub turns onto the other axis after <output></output> px across
          <input type="range" name="turnPx" min="10" max="120" step="5" />
        </label>
        <label>
          Minimum swipe length <output></output> px
          <input type="range" name="swipeMinPx" min="15" max="120" step="5" />
        </label>
        <label>
          Movement ignored as a tap <output></output> px
          <input type="range" name="slopPx" min="2" max="30" step="1" />
        </label>
        <label>
          Tap reach around a notehead <output></output> px
          <input type="range" name="tapReachPx" min="0" max="40" step="2" />
        </label>
        <label>
          Two-finger scrub step <output></output> px of travel
          <input type="range" name="twoStepPx" min="8" max="80" step="2" />
        </label>
        <label>
          Two-finger flick up/down jumps an octave when at least <output></output> px long
          <input type="range" name="octaveMinPx" min="40" max="300" step="10" />
        </label>
        <label>
          … and at least <output></output> px/ms fast
          <input type="range" name="octaveSpeed" min="0.3" max="4" step="0.1" />
        </label>
        <label>
          One-sided slide (accidentals): one finger slides <output></output> px sideways (0 is off)…
          <input type="range" name="sideMovePx" min="0" max="60" step="2" />
        </label>
        <label>
          …while the other stays within <output></output> px
          <input type="range" name="sideStillPx" min="2" max="30" step="1" />
        </label>
        <label>
          …and ♭ / ♯ / ♮ after <output></output> px of slide
          <input type="range" name="sideAccidPx" min="10" max="80" step="2" />
        </label>
        <label>
          Dots: two fingers still for <output></output> ms, then one lifts…
          <input type="range" name="dotHoldMs" min="0" max="600" step="25" />
        </label>
        <label>
          …and taps again within <output></output> ms (0 is off)
          <input type="range" name="dotTapMs" min="0" max="1500" step="50" />
        </label>
        <label>
          …each finger moving at most <output></output> px
          <input type="range" name="dotStillPx" min="4" max="60" step="2" />
        </label>
        <label class="check">
          <input type="checkbox" name="twoModeLock" />
          Two-finger mode lock (scrubs keep their axis; lift both fingers between edits)
        </label>
        <label>
          Two-finger session: both fingers still <output></output> ms closes a segment (0 is off)
          <input type="range" name="twoRestMs" min="0" max="800" step="25" />
        </label>
        <label>
          Facsimile strip: <output></output> % of the score area
          <input type="range" name="stripPct" min="15" max="70" step="5" />
        </label>
        <label>
          Facsimile fits
          <select name="facFit">
            <option value="screen">the measures on screen (never larger than the score)</option>
            <option value="selection">the selected measure, as tall as the score's system</option>
          </select>
        </label>
        <label>
          Entry pane on the
          <select name="paneSide">
            <option value="right">right</option>
            <option value="left">left</option>
          </select>
        </label>
        <label>
          Entry pane: <output></output> px per staff position (line or space)
          <input type="range" name="paneStepPx" min="10" max="30" step="1" />
        </label>
        <label>
          Entry pane: show the ghost after <output></output> ms (a second finger sooner makes it two-finger)
          <input type="range" name="paneGhostDelayMs" min="0" max="200" step="10" />
        </label>
        <label>
          Entry pane: slide sideways <output></output> px for ♯ (right) or ♭ (left); 0 is off
          <input type="range" name="paneAccidPx" min="0" max="80" step="2" />
        </label>
        <label>
          Showing edits
          <select name="renderMode">
            <option value="auto">Auto: ghost notes while reloads are slow</option>
            <option value="real">Always reload Verovio</option>
            <option value="fake">Always ghost notes, reload on a pause</option>
          </select>
        </label>
        <label>
          Auto uses ghost notes when reloads take about <output></output> ms or more
          <input type="range" name="autoFakeMs" min="40" max="600" step="10" />
        </label>
        <label>
          Ghost notes: reload after a pause of <output></output> ms
          <input type="range" name="fakeIdleMs" min="100" max="1500" step="50" />
        </label>
        <label>
          Reload
          <select name="reloadScope">
            <option value="page">only the page on screen (Verovio select)</option>
            <option value="full">the whole file</option>
          </select>
        </label>
        <div class="stats">
          <span>Edit reload times for this score</span>
          <output id="reload-stats"></output>
          <button type="button" id="reload-stats-reset">Reset times</button>
        </div>
        <div class="stats">
          <span>Edits are kept in this browser, per score</span>
          <output id="edits-state"></output>
          <button type="button" id="edits-revert">Revert this score to the original</button>
        </div>
        <menu>
          <button type="button" value="reset" id="settings-reset">Defaults</button>
          <button value="close">Close</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
