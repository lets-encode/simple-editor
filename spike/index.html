<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Gesture spike</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="main">
        <main id="stage">
          <div id="score" aria-label="Score"></div>
          <div id="box" hidden></div>
          <div id="hud">
            <span id="hud-gesture"></span>
            <span id="hud-selection"></span>
          </div>
          <div id="loading">Loading Verovio…</div>
        </main>
        <!-- The facsimile sheet slides over the score from the top; see src/facsimile.js. -->
        <section id="sheet" aria-label="Source facsimile" hidden>
          <div id="fac-view">
            <div id="fac-content">
              <img id="fac-img" alt="" draggable="false" />
              <div id="fac-zones"></div>
            </div>
            <button type="button" id="fac-sync" hidden>Sync</button>
          </div>
          <div id="fac-handle"><span class="grip"></span><span class="label">Source</span></div>
        </section>
      </div>
      <nav id="bar" aria-label="Controls"></nav>
    </div>

    <dialog id="settings">
      <form method="dialog">
        <h2>Gesture settings</h2>
        <label>
          Score
          <select name="fixture"></select>
        </label>
        <label>
          Flick window (lift sooner for one step) <output></output> ms
          <input type="range" name="swipeWindowMs" min="100" max="500" step="10" />
        </label>
        <label>
          Hold still this long to arm a drag box <output></output> ms
          <input type="range" name="holdMs" min="150" max="800" step="25" />
        </label>
        <label>
          Scrub direction (horizontal or vertical) judged over the first <output></output> px
          <input type="range" name="axisPx" min="8" max="60" step="2" />
        </label>
        <label>
          Scrub step <output></output> px of travel
          <input type="range" name="scrubStepPx" min="8" max="80" step="2" />
        </label>
        <label>
          Scrub turns onto the other axis after <output></output> px across
          <input type="range" name="turnPx" min="10" max="120" step="5" />
        </label>
        <label>
          Minimum swipe length <output></output> px
          <input type="range" name="swipeMinPx" min="15" max="120" step="5" />
        </label>
        <label>
          Movement ignored as a tap <output></output> px
          <input type="range" name="slopPx" min="2" max="30" step="1" />
        </label>
        <label>
          Tap reach around a notehead <output></output> px
          <input type="range" name="tapReachPx" min="0" max="40" step="2" />
        </label>
        <label>
          Two-finger scrub step <output></output> px of travel
          <input type="range" name="twoStepPx" min="8" max="80" step="2" />
        </label>
        <label>
          Two-finger flick up/down jumps an octave when at least <output></output> px long
          <input type="range" name="octaveMinPx" min="40" max="300" step="10" />
        </label>
        <label>
          … and at least <output></output> px/ms fast
          <input type="range" name="octaveSpeed" min="0.3" max="4" step="0.1" />
        </label>
        <label>
          Facsimile strip: <output></output> % of the score area
          <input type="range" name="stripPct" min="15" max="70" step="5" />
        </label>
        <label>
          Facsimile fits
          <select name="facFit">
            <option value="screen">the measures on screen (never larger than the score)</option>
            <option value="selection">the selected measure, as tall as the score's system</option>
          </select>
        </label>
        <label>
          Showing edits
          <select name="renderMode">
            <option value="auto">Auto: ghost notes while reloads are slow</option>
            <option value="real">Always reload Verovio</option>
            <option value="fake">Always ghost notes, reload on a pause</option>
          </select>
        </label>
        <label>
          Auto uses ghost notes when reloads take about <output></output> ms or more
          <input type="range" name="autoFakeMs" min="40" max="600" step="10" />
        </label>
        <label>
          Ghost notes: reload after a pause of <output></output> ms
          <input type="range" name="fakeIdleMs" min="100" max="1500" step="50" />
        </label>
        <label>
          Reload
          <select name="reloadScope">
            <option value="page">only the page on screen (Verovio select)</option>
            <option value="full">the whole file</option>
          </select>
        </label>
        <div class="stats">
          <span>Edit reload times for this score</span>
          <output id="reload-stats"></output>
          <button type="button" id="reload-stats-reset">Reset times</button>
        </div>
        <menu>
          <button type="button" value="reset" id="settings-reset">Defaults</button>
          <button value="close">Close</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
